<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Bill Chen — Portfolio</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — https://github.com/rafgraph/spa-github-pages
      // GitHub Pages has no server-side SPA fallback. Any deep URL such as
      // /react_portfolio_site_js/about serves this 404.html, and this script
      // rewrites it into /react_portfolio_site_js/?/about so index.html loads
      // and the companion script in index.html can restore the intended path.
      //
      // pathSegmentsToKeep = 1 because the site is served under a repo path
      // (`/react_portfolio_site_js/`). For a custom domain served at the root
      // this would be 0.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
